name: Build AcademiaOS Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "artifacts/academia-os-desktop/**"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: read

concurrency:
  group: academiaos-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Build Windows 1.0.12
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      npm_config_msvs_version: "2022"
      GYP_MSVS_VERSION: "2022"

    defaults:
      run:
        shell: pwsh
        working-directory: artifacts/academia-os-desktop

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: artifacts/academia-os-desktop/pnpm-lock.yaml

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure native Windows compiler
        run: |
          $python = (Get-Command python).Source

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "PYTHON=$python"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "npm_config_python=$python"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "npm_config_msvs_version=2022"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "GYP_MSVS_VERSION=2022"

          Write-Host "Python: $python"
          Write-Host "Visual Studio toolset: 2022"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Build Windows installer
        run: pnpm run dist:win

      - name: Verify installer and create checksum
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $installer = "release/AcademiaOS-Desktop-Windows-$($package.version)-Setup.exe"

          if (-not (Test-Path $installer)) {
            throw "Windows installer was not created: $installer"
          }

          $hash = (
            Get-FileHash $installer -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          $hashFile = "$installer.sha256.txt"

          "$hash  $(Split-Path $installer -Leaf)" |
            Set-Content -Path $hashFile -Encoding ascii

          Write-Host "Installer: $installer"
          Write-Host "SHA256: $hash"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: AcademiaOS-Desktop-Windows-1.0.12
          path: |
            artifacts/academia-os-desktop/release/AcademiaOS-Desktop-Windows-1.0.12-Setup.exe
            artifacts/academia-os-desktop/release/AcademiaOS-Desktop-Windows-1.0.12-Setup.exe.sha256.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
