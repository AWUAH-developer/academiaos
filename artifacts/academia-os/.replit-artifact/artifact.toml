kind = "web"
previewPath = "/"
title = "AcademiaOS"
version = "1.0.0"
id = "artifacts/academia-os"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18361

[services.env]
PORT = "18361"

[services.development]
run = "pnpm --filter @workspace/academia-os run dev"

[services.production]

[services.production.build]
args = ["sh", "-c", "cd artifacts/academia-os && pnpm build"]

[services.production.build.env]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"

[services.production.run]
args = ["sh", "-c", "cd artifacts/academia-os && pnpm start"]

[services.production.run.env]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"

[services.production.health.startup]
path = "/api/health"
