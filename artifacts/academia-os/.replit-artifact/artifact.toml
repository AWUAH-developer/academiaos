kind = "web"
previewPath = "/"
title = "AcademiaOS"
version = "1.0.0"
id = "artifacts/academia-os"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18361

[services.env]
PORT = "18361"

[services.development]
run = "pnpm --filter @workspace/academia-os run dev"

[services.production]

[services.production.build]
args = ["sh", "-c", "pnpm --filter @workspace/academia-os run db:migrate && pnpm --filter @workspace/academia-os run db:provision-auth && pnpm --filter @workspace/academia-os run build"]

[services.production.build.env]
NODE_ENV = "production"
ACADEMIAOS_DEMO_MODE = "true"
NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS = "true"
NEXT_TELEMETRY_DISABLED = "1"

[services.production.run]
args = ["node", "artifacts/academia-os/scripts/start.mjs"]

[services.production.run.env]
NODE_ENV = "production"
ACADEMIAOS_DEMO_MODE = "true"
NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS = "true"
NEXT_TELEMETRY_DISABLED = "1"

[services.production.health.startup]
path = "/api/health"
